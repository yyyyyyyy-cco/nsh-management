# ===== frontend 容器内层 Nginx 配置（构建输入：frontend/Dockerfile 通过 COPY 引入） =====
# 职责边界（单层 TLS 架构，权威源 DEPLOY.md §二）：
#   本文件只负责「静态资源 + SPA 回退 + 缓存头 + /api 反代」，监听明文 :80、不映射宿主端口；
#   TLS / 证书 / 限流 / 安全响应头 / HTTP→HTTPS 跳转全部由边缘 nginx-proxy 承担（模板见 nginx.conf.example）。
# 占位符：YOUR_DOMAIN 等由部署环境替换。服务器上的实际文件可能与本文件不同，按 DEPLOY.md §三
#   「服务器配置类文件的变更规则」单独维护（deploy.sh 排除清单同样排除本文件，避免本地版覆盖服务器）。
# 变更后必须 docker compose up -d --build 重建 frontend 镜像才会生效（nginx.conf 随镜像 COPY 进容器）。
#
# 2026-10-02 入库说明：此前本文件被 .gitignore 排除且不在仓库内，导致全新克隆执行
#   docker compose up -d --build 时在 `COPY nginx.conf` 一步直接失败（合规化计划 F-08 / W1-1）。

server_tokens off;

# 真实客户端 IP：边缘层经 X-Forwarded-For 透传，proxy-net 为可信来源
set_real_ip_from 172.20.0.0/16;
real_ip_header X-Forwarded-For;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # 静态资源扩展名白名单（2026-10-02 新增，合规化计划 W4-21 / ASVS 13.4.7）：
    #   只服务构建产物中**真实存在**的类型——本仓库 `npm run build` 的 dist 实测扩展名集合为
    #   `.js`（55 个）、`.css`（19 个）、`.html`（仅根目录 index.html，不在此路径下）。
    #   其余类型（如有人误放 `.html`/脚本进 assets）由外层 `return 404` 兜底拒绝，
    #   避免把非预期文件当作可执行/可渲染资源提供。
    #   注：`add_header` 只在「当前层没有 add_header」时才继承父层——下方内层 location 无 add_header，
    #   故仍继承本层的 immutable 缓存头（nginx 官方语义）。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        location ~* ^/assets/.+\.(js|mjs|css|map|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot)$ {
            try_files $uri =404;
        }

        # 非白名单扩展名一律 404（含目录列表/其它资源）
        return 404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 客户端 IP 头部原样透传，勿用 $remote_addr / $proxy_add_x_forwarded_for 覆盖
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}