# 本地/单机演示拓扑：frontend 映射宿主 80/443 并挂载 Let's Encrypt 证书。
# 生产服务器使用「单层 TLS」拓扑：由同机 nginx-proxy 独占 TLS/限流/安全响应头，
# frontend 无宿主端口、不挂证书，且服务器上的该文件与本文件不同（单独维护）。
# 权威源：DEPLOY.md §二（部署架构）与 §三（服务器配置类文件的变更规则）。
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # 生产环境标识：启动时强制校验 SECRET_KEY 强度，弱密钥拒绝启动（见 backend/app/core/config.py）
      APP_ENV: production
    volumes:
      - nsh-data:/app/data
      - nsh-logs:/app/logs
    networks:
      - nsh-net
    # 安全加固
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/nginx/ssl:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nsh-net
    # 安全加固
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"

volumes:
  nsh-data:
  nsh-logs:

networks:
  nsh-net:
