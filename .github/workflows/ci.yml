# ===== CI 门禁（合规化计划 W2-1） =====
# 设计原则：每个 job 都是「当前仓库真实能通过」的检查，不引入必然失败的步骤。
#
# job 说明：
#   backend       语法编译 + 迁移可用性（空库升级到 head）+ 应用可导入（含启动门禁）
#   frontend      npm ci + vue-tsc 类型检查 + vite 构建（与前端镜像构建同源）
#   repo-hygiene  行数规则脚本 + 陈旧绝对路径 + 换行归一（W0-2/W2-5 的回归护栏）
#                 + 3 个报告型对账（字段/路由/表结构漂移；continue-on-error，只告警不阻断）
#   docker-build  双镜像构建 —— 这一项正是 F-08（frontend/Dockerfile COPY nginx.conf 缺失）的回归护栏
#
# 现状（2026-10-03 核对，替换原先的「后续扩展」设想——其前置条件均已满足）：
#   - backend job 已含 `python -m pytest`（W2-2 完成）与 `ruff check .`（W2-3 完成）
#   - frontend job 已含 `npm run lint` 与 `npm run test`（W2-3 / W1-13 完成）
#   - repo-hygiene 已含 7 道门禁中的全部（每道均为「自检 + 实跑」两步；2026-10-03 补齐 check_file_length 的自检）
#   - repo-hygiene 末尾另含 3 个**报告型**对账步骤（check_type_drift / check_api_paths / check_schema_drift，F-92~F-95）：均为「自检 + 严格模式」，带 continue-on-error —— 漂移只在页面告警，不阻断流水线
#   - commit-msg 作业校验基线之后的每个提交（基线文件 .github/commit-msg-baseline）
#   - docker-build 为双镜像构建护栏（F-08 回归）
#   仍未接入：mypy（见计划 W2-14）；Node/Python 基座版本待 W1-5/W1-7 统一后同步
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: 后端（编译 / 迁移 / 导入）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # 显式声明开发环境，避免依赖 /.dockerenv 兜底判定；密钥用 64 位十六进制（满足启动门禁，仅用于 CI）
      APP_ENV: development
      SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # 与 backend/Dockerfile 基座一致；W1-5 统一版本后同步
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: 安装依赖（运行时 + 开发）
        run: pip install -r requirements-dev.txt
      - name: 静态检查（ruff，配置见 backend/ruff.toml）
        run: ruff check .
      - name: 语法编译（app / scripts / alembic）
        run: python -m compileall -q app scripts alembic
      - name: 迁移可用性（空库升级到 head）
        run: alembic upgrade head
      # —— 报告型：文档 ↔ 真实迁移产物（W2-15 / F-97）。本 job 已装 alembic，
      #    脚本自带临时库；带 continue-on-error：漂移只告警不阻断 ——
      - name: 文档 ↔ 真实迁移产物字段对账（自检 + 严格模式；仅报告）
        continue-on-error: true
        run: |
          python ../scripts/check_schema_vs_db.py --self-test
          python ../scripts/check_schema_vs_db.py --strict
      - name: 应用可导入（同时验证启动门禁不误杀）
        run: python -c "import app.main; print('app.main 导入成功')"
      # —— 报告型：静态类型（W2-14 / F-99）。存量诊断未清零，continue-on-error 只告警 ——
      - name: 静态类型（mypy，报告型）
        continue-on-error: true
        run: |
          python -m mypy --version
          python -m mypy app
      - name: 测试套件（pytest：新用例 + 既有 selfcheck）
        env:
          # 测试使用内存库，不依赖 data/ 下的库文件；显式声明避免落到真实路径
          # 注意：值必须以引号包裹——纯标量以「:」结尾（如 :memory:）会被 YAML 当作映射值指示符
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: python -m pytest

  frontend:
    name: 前端（类型检查 / 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖（按 lockfile）
        run: npm ci --no-audit --no-fund
      - name: 类型检查 + 生产构建
        run: npm run build
      - name: 静态检查（ESLint，配置见 frontend/eslint.config.js）
        run: npm run lint
      - name: 单元测试（Vitest，配置见 frontend/vitest.config.ts）
        run: npm run test

  repo-hygiene:
    name: 仓库卫生（行数 / 路径 / 换行）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 文件行数规则（自检 + 标记/登记双重校验）
        run: |
          python scripts/check_file_length.py --self-test
          python scripts/check_file_length.py
      - name: 依赖清单锁定（自检 + 实际清单）
        run: |
          python scripts/check_requirements_pins.py --self-test
          python scripts/check_requirements_pins.py
      - name: 环境变量文档联动（自检 + 实际文件）
        run: |
          python scripts/check_env_docs.py --self-test
          python scripts/check_env_docs.py
      - name: 整改计划结构一致性（自检 + 实际文件）
        run: |
          python scripts/check_plan_integrity.py --self-test
          python scripts/check_plan_integrity.py
      - name: 文档数字/版本一致性（自检 + 实际文件）
        run: |
          python scripts/check_doc_numbers.py --self-test
          python scripts/check_doc_numbers.py
      - name: 判定与修复状态同步（自检 + 严格模式）
        run: |
          python scripts/check_verdict_sync.py --self-test
          python scripts/check_verdict_sync.py --strict
      - name: 陈旧绝对路径（不得出现旧仓库位置）
        run: |
          python scripts/check_stale_paths.py --self-test
          python scripts/check_stale_paths.py

      - name: 换行归一（索引中不应有 CRLF）
        run: |
          set -e
          bad=$(git ls-files --eol | awk '$1=="i/crlf"' | wc -l)
          echo "索引中 CRLF 文件数：$bad"
          if [ "$bad" -ne 0 ]; then
            echo "::error::有 $bad 个文本文件以 CRLF 入库；检查 .gitattributes 并执行 git add --renormalize ."
            exit 1
          fi

      # —— 报告型对账（F-92 / F-93 / F-94 / F-95）：本地全绿，带 continue-on-error ——
      #    漂移属需要人工处置的告警：在页面上暴露，但不阻断流水线。
      - name: 前后端字段一致性（自检 + 严格模式；仅报告）
        continue-on-error: true
        run: |
          python scripts/check_type_drift.py --self-test
          python scripts/check_type_drift.py --strict
      - name: 前端调用 ↔ 后端路由（自检 + 严格模式；仅报告）
        continue-on-error: true
        run: |
          python scripts/check_api_paths.py --self-test
          python scripts/check_api_paths.py --strict
      - name: 数据库权威源 ↔ 模型字段（自检 + 严格模式；仅报告）
        continue-on-error: true
        run: |
          python scripts/check_schema_drift.py --self-test
          python scripts/check_schema_drift.py --strict

  commit-msg:
    name: 提交消息规范（基线之后）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要基线提交可达，才能对「基线..HEAD」范围逐个校验
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 校验脚本自检（内置用例）
        run: python scripts/check_commit_msg.py --self-test
      - name: 校验本次范围内的提交消息
        run: |
          set -e
          BASE=$(tr -d '[:space:]' < .github/commit-msg-baseline)
          echo "校验基线：$BASE"
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::error::基线提交 $BASE 不可达；请确认 actions/checkout 使用 fetch-depth: 0"
            exit 2
          fi
          fail=0; n=0
          for sha in $(git rev-list "${BASE}..HEAD" --no-merges); do
            n=$((n+1))
            if ! git log -1 --format='%B' "$sha" | python scripts/check_commit_msg.py --stdin --quiet; then
              echo "::error::提交 $sha 的消息不符合 .agent/rules/git-commit-message.md"
              fail=$((fail+1))
            fi
          done
          echo "校验提交数=$n，违规=$fail"
          [ "$fail" -eq 0 ]

  docker-build:
    name: 镜像构建（后端 + 前端）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 后端镜像
        run: docker build -t nsh-backend:ci backend
      - name: 前端镜像（F-08 回归护栏：COPY nginx.conf）
        run: docker build -t nsh-frontend:ci frontend