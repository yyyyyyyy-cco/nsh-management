# ===== pytest 配置（合规化计划 W2-2） =====
# 作用域：后端。前端 Vitest 仍待引入（W2-2 收尾项）。
#
# 设计要点：
#   1. 不引入 pytest-asyncio：异步用例统一用 unittest.IsolatedAsyncioTestCase（与既有
#      backend/scripts/selfcheck_*.py 同风格），因此测试依赖只有 pytest（+ httpx 备用）。
#   2. python_files 同时匹配 test_*.py 与 selfcheck_*.py —— 后者本就是 unittest 用例类，
#      可直接被 pytest 收集执行，无需改写（scripts/selfcheck_indicators.py 已于 2026-10-02
#      由「模块级断言脚本」改造为用例类，故不再需要 --ignore，见合规化计划 W2-2 收尾项）。
#   3. 严格告警：对 async 测试标记误用等问题提前暴露。
#   4. 依赖缺失时**模块级跳过**：需第三方依赖的用例模块（tests/test_core_security.py、
#      test_permissions.py、test_health.py、test_alerting_service.py）与 7 个
#      scripts/selfcheck_*.py 均在导入失败时 raise unittest.SkipTest —— 因此无依赖环境
#      （如本地 Python 3.14）执行 `pytest` 得到「0 error + 若干 skipped」，
#      而不是收集期 ImportError（退出码 2）。
#      反例：把第三方 import 留在 try 之外会**绕过** skipUnless（见 ai-checklist 第 32 条）。

[pytest]
testpaths = tests scripts
python_files = test_*.py selfcheck_*.py
python_classes = *Tests *Test
python_functions = test_*
addopts = -q
# ↑ 曾经的 `--ignore=scripts/selfcheck_indicators.py` 已移除：该文件已改造为用例类（W2-2 收尾项），
#   现在与其余 selfcheck_* 一样由 pytest 收集；仍支持 `python scripts/selfcheck_indicators.py` 直接运行。
filterwarnings =
    error::DeprecationWarning:app.*
    default