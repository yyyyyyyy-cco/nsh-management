# ===== pytest 配置（合规化计划 W2-2） =====
# 作用域：后端。前端 Vitest 仍待引入（W2-2 收尾项）。
#
# 设计要点：
#   1. 不引入 pytest-asyncio：异步用例统一用 unittest.IsolatedAsyncioTestCase（与既有
#      backend/scripts/selfcheck_*.py 同风格），因此测试依赖只有 pytest（+ httpx 备用）。
#   2. python_files 同时匹配 test_*.py 与 selfcheck_*.py —— 后者本就是 unittest 用例类，
#      可直接被 pytest 收集执行，无需改写（scripts/selfcheck_indicators.py 例外，见 addopts）。
#   3. 严格告警：对 async 测试标记误用等问题提前暴露。

[pytest]
testpaths = tests scripts
python_files = test_*.py selfcheck_*.py
python_classes = *Tests *Test
python_functions = test_*
addopts = -q --ignore=scripts/selfcheck_indicators.py
# ↑ selfcheck_indicators.py 是「模块级断言脚本」而非用例类（尚未改造，见计划 W2-2 收尾项）；
#   它仍在 CI 中作为脚本独立执行，避免在收集期执行模块级代码。
filterwarnings =
    error::DeprecationWarning:app.*
    default