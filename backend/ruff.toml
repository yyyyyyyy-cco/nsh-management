# ===== Ruff 配置（合规化计划 W2-3） =====
# 定位：后端 Python 静态检查，CI 门禁之一（.github/workflows/ci.yml 的 backend job 执行 `ruff check .`）。
# 作用域：仅后端。前端 ESLint/Prettier 仍在计划中（W2-3 收尾项）。
# 规则启用状况（2026-10-03 更新，W2-14 ② 分批落地）：
#   · 已启用：E4/E7/E9 + F（原有）→ I（导入排序，批次 190）→ UP（语法升级，批次 191）。
#   · 已启用（批次 192）：**E501（行长）与 `ruff format`**（一次性格式化 123 文件）；
#     迁移目录同时豁免 lint 与 format；一次性分析脚本 sim_contribution_v4 豁免 E501（宽表格刻意紧凑）；
#     无法安全折行的长行：**代码行**用 `# noqa: E501`；**docstring 内**的长行必须折行（noqa 在字符串内无效）。
#   · B（bugbear）经评估不照单全收：实测 169 处中含 FastAPI `Depends()` 惯用法（B008）等需大量 noqa 的项。
#   · 迁移文件（alembic/versions/*）豁免 I001 与 UP：autogenerate 产物不做 churn。

target-version = "py311"   # 与 backend/Dockerfile 的 python:3.11-slim 一致（W1-5 统一版本后同步）
line-length = 120          # 仅影响 format 与 E501；当前未启用 E501

exclude = [".venv", "__pycache__", "data", "logs"]
extend-exclude = ["alembic/versions/*"]   # 同 I/UP：autogenerate 产物不做格式化 churn

[lint]
# 规则集：E4/E7/E9 + F（pyflakes：未定义名、未使用导入/变量、f-string 缺占位符等）
# 全局忽略 UP009（UTF-8 编码声明）：项目刻意为 15 个 .py 保留 `# -*- coding: utf-8 -*-`
#（cp936 敏感的既有决定，见 tech-stack.md / README.md 与 ai-checklist #26），不由格式化工具删除
ignore = ["UP009", "UP038"]  # UP038（isinstance 用 X | Y）：ruff 将其修复标为 unsafe，全仓仅 1 处，保留既有显式元组写法
select = ["E4", "E7", "E9", "F", "I", "UP", "E501"]

[lint.per-file-ignores]
# Alembic 迁移为 autogenerate 产物：保持生成原样，且后续生成的迁移仍会带未使用导入
"alembic/versions/*.py" = ["F401", "I001", "UP"]  # 自动生成迁移不做导入排序/语法升级（价值低、churn 大）
"app/services/game_id_request_service.py" = ["E501"]  # 本文件因行数上限不参与格式化（见 [format].exclude），长行由此豁免承担；待拆分后再纳入格式化
# 2026-09-07 权重推导系列为一次性分析脚本，采用紧凑单行语句风格（与产品代码风格不同）
"scripts/audit_weights_v4_20260907.py" = ["E701", "E702"]
"scripts/derive_weights_v4_20260907.py" = ["E701", "E702"]
"scripts/sim_contribution_v4_20260907.py" = ["E701", "E702", "E501"]  # 宽表格打印行为刻意紧凑

[format]
# 仅对该文件关闭**格式化**（仍受 lint 检查）：原为 300 行（恰在上限），ruff format 会折行至 301 行而越界；
# 待按 file-length-rule 拆分后再纳入格式化。**不要**把它放进 extend-exclude（那会连 lint 一起静默）。
exclude = ["app/services/game_id_request_service.py"]
