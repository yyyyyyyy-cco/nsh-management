# mypy 配置（W2-14，2026-10-03 引入）
# 定位：**报告型**门禁——先让类型检查跑起来并暴露问题，存量诊断清零前不阻断 CI
# （详见 .agent/plans/compliance-remediation-plan.md 的 W2-14 与 F-99）。

[mypy]
# 与 CI（actions/setup-python 3.11）和生产镜像基座一致
python_version = 3.11
# 未带类型标注的第三方包不报错（SQLAlchemy/asyncpg 等按需再加插件）
ignore_missing_imports = True
# 存量清零前不因 `# type: ignore` 未被使用而失败
warn_unused_ignores = False
# pydantic 插件：修复 Field(None, ...) 被误判为"缺少必填参数"的假报（F-98 同批 2 条）
plugins = pydantic.mypy

[mypy-tests.*]
# 测试用例优先可读性，不强制注解
disallow_untyped_defs = False
