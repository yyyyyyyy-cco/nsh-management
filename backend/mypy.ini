; mypy configuration (W2-14, 2026-10-03)
; NOTE: keep this file ASCII-only. mypy reads config via configparser with the
; LOCALE encoding; non-ASCII comments crash on Windows (GBK) with UnicodeDecodeError
; and mypy exits 2 without checking anything.
; Scope: REPORT-ONLY gate -- baseline diagnostics must reach zero before it blocks CI.
; See .agent/plans/compliance-remediation-plan.md (W2-14 / F-99).

[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = False
plugins = pydantic.mypy

[mypy-tests.*]
disallow_untyped_defs = False
